name: Build Windows Coaster Generator

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install OpenSCAD
        run: |
          choco install openscad -y
          if (!(Test-Path "C:\Program Files\OpenSCAD\openscad.exe")) {
            throw "OpenSCAD installation failed"
          }

      - name: Verify OpenSCAD
        run: |
          & "C:\Program Files\OpenSCAD\openscad.exe" --version

      - name: Build Windows application
        run: |
          pyinstaller --clean coasters.spec

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RLO-Player-Coaster-Generator-Windows
          path: dist/
